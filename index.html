<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Brasil — Jogos, Transmissões e Resultados</title>
  <meta name="description" content="Agenda diária da NBA no horário de Brasília, onde assistir no Brasil, resultados e classificação." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <header class="topo">
    <h1>🏀 NBA <span>Brasil</span></h1>
    <nav class="abas">
      <button id="aba-jogos" class="aba ativa" data-view="jogos">Jogos</button>
      <button id="aba-tabela" class="aba" data-view="tabela">Classificação</button>
      <button id="aba-lideres" class="aba" data-view="lideres">Líderes</button>
    </nav>
  </header>

  <main>
    <section id="view-jogos" class="view">
      <div class="barra-dias-wrap">
        <div id="dias" class="dias"></div>
        <div class="seletor-data-wrap">
          <label for="data-escolhida" class="btn btn-calendario" title="Escolher qualquer data histórica">
            📅 <span id="label-calendario">Calendário</span>
            <input type="date" id="data-escolhida" />
          </label>
          <button id="btn-hoje" class="btn btn-hoje oculto" title="Voltar para hoje">Hoje</button>
        </div>
      </div>
      <div class="filtros">
        <label><input type="checkbox" id="so-tv" /> Só jogos com transmissão na TV/streaming BR</label>
        <button id="btn-atualizar" class="btn">↻ Atualizar</button>
      </div>
      <div id="jogos" class="grade"></div>
    </section>

    <section id="view-tabela" class="view oculto">
      <div class="filtro-temporada">
        <label for="sel-temporada">Temporada:</label>
        <select id="sel-temporada" class="select-moderno"></select>
      </div>
      <div id="tabela" class="tabelas"></div>
    </section>

    <section id="view-lideres" class="view oculto">
      <div id="lideres" class="tabelas"></div>
    </section>

    <section id="view-detalhe" class="view oculto">
      <div id="detalhe"></div>
    </section>
  </main>

  <footer>Dados: ESPN · Horários de Brasília · Atualiza automaticamente a cada 60s</footer>
  <script src="detalhes.js"></script>
  <script src="app.js"></script>
</body>
</html>
